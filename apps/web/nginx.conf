server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── فشرده‌سازی ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff2;

    # ── سربرگ‌های امنیتی ───────────────────────────────────────────────────
    # API خودش Helmet دارد؛ اینها برای فایل‌های HTML و دارایی‌های ایستا است.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    #
    # Content-Security-Policy
    #
    # `'unsafe-inline'` برای style لازم است چون Tailwind مقادیر پویا
    # (مثل عرض نوار پیشرفت) را به‌صورت style درون‌خطی می‌نویسد. برای اسکریپت
    # هیچ استثنایی وجود ندارد.
    #
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # آپلود فایل Excel برای ورود اطلاعات و دانلود پشتیبان
        client_max_body_size 60m;

        # پشتیبان‌گیری و ورود اطلاعات ممکن است چند دقیقه طول بکشد
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # پاسخ API هرگز Cache نمی‌شود: نمایش موجودی کهنه به کتابدار
        # بدتر از نمایش خطاست.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ── دارایی‌های ایستا ───────────────────────────────────────────────────
    # نام فایل‌ها هش محتوا دارد، پس Cache طولانی امن است.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── مسیرهای برنامه ─────────────────────────────────────────────────────
    #
    # برنامه تک‌صفحه‌ای است: مسیرهایی مثل `/books/123` فایل ندارند و باید
    # به `index.html` برسند تا مسیریاب سمت کلاینت آنها را حل کند. بدون این،
    # تازه کردن صفحه در هر مسیر داخلی، خطای ۴۰۴ می‌دهد.
    #
    location / {
        try_files $uri $uri/ /index.html;
        # خود `index.html` نباید Cache شود؛ وگرنه پس از استقرار نسخه جدید،
        # مرورگر همچنان نسخه قدیمی را با ارجاع به فایل‌های حذف‌شده باز می‌کند.
        add_header Cache-Control "no-cache" always;
    }
}
